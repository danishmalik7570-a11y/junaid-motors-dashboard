{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Junaid Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.45) 0%, rgba(10, 11, 15, 0.65) 100%), 
                  url("{% static 'img/login-bg.jpg' %}") center center / cover no-repeat fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Overlay Effect */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.12) 0%, rgba(0, 0, 0, 0.3) 100%);
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      padding: 1.25rem;
      position: relative;
      z-index: 2;
    }

    /* Transparent Glass Card */
    .login-card {
      background: rgba(15, 23, 42, 0.35) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      border-radius: 1.25rem;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.08);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-badge {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.9) 0%, rgba(29, 78, 216, 0.9) 100%);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
      margin-bottom: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .login-logo h2 {
      font-family: 'Outfit', sans-serif;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.65rem;
      letter-spacing: -0.02em;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .login-logo p {
      color: #E2E8F0;
      font-size: 0.85rem;
      margin-top: 4px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .form-label {
      color: #FFFFFF;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .input-group-text {
      background: rgba(0, 0, 0, 0.45) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-right: none !important;
      color: #93C5FD !important;
      border-top-left-radius: 0.6rem !important;
      border-bottom-left-radius: 0.6rem !important;
      padding-left: 0.95rem;
      padding-right: 0.95rem;
    }

    .form-control {
      background: rgba(0, 0, 0, 0.35) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-left: none !important;
      color: #FFFFFF !important;
      font-size: 0.92rem;
      padding: 0.65rem 0.95rem;
      border-top-right-radius: 0.6rem !important;
      border-bottom-right-radius: 0.6rem !important;
    }
    .form-control:focus {
      background: rgba(0, 0, 0, 0.55) !important;
      border-color: #2563EB !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35) !important;
      color: #FFFFFF !important;
    }
    .form-control::placeholder {
      color: #94A3B8 !important;
    }

    .btn-login {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.95) 0%, rgba(29, 78, 216, 0.95) 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #FFFFFF !important;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.45);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.6);
      background: linear-gradient(135deg, #1D4ED8 0%, #1E40AF 100%) !important;
    }

    .demo-credentials {
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 0.6rem;
      padding: 0.65rem 0.85rem;
      font-size: 0.78rem;
      color: #F1F5F9;
      margin-top: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-badge">
        <i class="bi bi-car-front-fill"></i>
      </div>
      <h2>Junaid Motors</h2>
      <p>Car Dealership Management System</p>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-danger py-2 mb-3 rounded-3" role="alert" style="background:rgba(239,68,68,0.25); border:1px solid rgba(239,68,68,0.4); color:#FCA5A5; font-size:0.85rem;">
      <i class="bi bi-exclamation-circle-fill me-2"></i>{{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
      </button>
    </form>

    <div class="mt-4 text-center" style="color:#CBD5E1; font-size:0.78rem; text-shadow:0 1px 3px rgba(0,0,0,0.6);">
      <i class="bi bi-shield-lock-fill me-1 text-primary"></i> Secure Dealership Management Portal
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
